<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SmartEval - Forgot Password</title>
  <style>
    /* RESET & FONT */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* SPLIT CONTAINER */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
    }
    .split-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* LEFT PANEL (Purple area) */
    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #7f5af0, #6246ea);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      color: #fff;
      padding: 60px;
    }
    .left-panel h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .left-panel p {
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 400px;
      opacity: 0.9;
    }

    /* RIGHT PANEL */
    .right-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f7;
      padding: 40px;
    }

    /* CONTAINER (Card) */
    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      width: 350px;
      text-align: center;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    /* HEADING in black */
    h2 {
      color: #333;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* FORM ELEMENTS */
    .input-field {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: #333; /* black text */
      outline: none;
      font-size: 16px;
    }
    .input-field::placeholder {
      color: rgba(0, 0, 0, 0.5);
    }
    .input-field:focus {
      background: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #ff8c00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #e67e00;
    }

    /* STEP SECTIONS HIDDEN */
    .hidden {
      display: none;
    }

    /* MESSAGES */
    .msg {
      margin-top: 10px;
      font-size: 14px;
      color: red; /* or green, based on usage */
    }
  </style>
</head>
<body>
  <div class="split-container">
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <h1>SmartEval</h1>
      <p>
        Reset your password quickly with our secure OTP flow.
        <br /><br />
        Smarter ways to evaluate. Secure, reliable, and easy to use — for both teachers and students.
      </p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="container">
        <h2>Forgot Password</h2>

        <!-- Step 1: Enter Email/Phone -->
        <div id="step1">
          <input
            type="text"
            id="emailPhone"
            class="input-field"
            placeholder="Enter Email or Phone"
          />
          <button class="btn" onclick="sendOTP()">Send OTP</button>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step2" class="hidden">
          <input
            type="text"
            id="otpInput"
            class="input-field"
            placeholder="Enter the 6-digit code"
          />
          <button class="btn" onclick="verifyOTP()">Verify OTP</button>
        </div>

        <!-- Step 3: Reset Password -->
        <div id="step3" class="hidden">
          <input
            type="password"
            id="newPassword"
            class="input-field"
            placeholder="New Password"
          />
          <input
            type="password"
            id="confirmPassword"
            class="input-field"
            placeholder="Confirm New Password"
          />
          <button class="btn" onclick="resetPassword()">Reset Password</button>
        </div>

        <!-- Message Display -->
        <div id="message" class="msg"></div>
      </div>
    </div>
  </div>

  <script>
    let generatedOTP = "";

    function sendOTP() {
      const emailPhone = document.getElementById("emailPhone").value.trim();
      const msgEl = document.getElementById("message");
      msgEl.textContent = "";

      if (!emailPhone) {
        msgEl.textContent = "Please enter your email or phone.";
        return;
      }

      // For demonstration, we'll generate a random 6-digit code on the client side.
      // In a real app, you'd fetch from the server.
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      // Show it or alert it (for testing only)
      alert("Your OTP is: " + generatedOTP);

      // Show Step 2
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }

    function verifyOTP() {
      const enteredOTP = document.getElementById("otpInput").value.trim();
      const msgEl = document.getElementById("message");
      msgEl.textContent = "";

      if (!enteredOTP) {
        msgEl.textContent = "Please enter the 6-digit code.";
        return;
      }

      if (enteredOTP === generatedOTP) {
        msgEl.style.color = "green";
        msgEl.textContent = "OTP Verified! You can now reset your password.";
        // Show Step 3
        document.getElementById("step2").classList.add("hidden");
        document.getElementById("step3").classList.remove("hidden");
      } else {
        msgEl.style.color = "red";
        msgEl.textContent = "Invalid OTP. Please try again.";
      }
    }

    function resetPassword() {
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const msgEl = document.getElementById("message");
      msgEl.textContent = "";
      msgEl.style.color = "red";

      if (!newPassword || !confirmPassword) {
        msgEl.textContent = "Please enter and confirm your new password.";
        return;
      }

      if (newPassword !== confirmPassword) {
        msgEl.textContent = "Passwords do not match.";
        return;
      }

      // Passwords match, success
      msgEl.style.color = "green";
      msgEl.textContent = "Password reset successfully! Redirecting to login...";
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    }
  </script>
</body>
</html>
